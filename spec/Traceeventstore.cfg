\* Used by spec/trace/validate.sh with a generated MCtrace module that
\* EXTENDS Traceeventstore and defines MCTraceFile as one trace's path.
CONSTANTS
  TraceFile <- MCTraceFile
  Ids <- TraceIds
  Commands <- TraceCommands
  Events <- TraceEvents
  Handlers <- TraceHandlers
  Requests <- TraceRequests
  Workers <- TraceWorkers
  MaxAttempts <- TraceMaxAttempts
  None = None

INIT TraceInit
NEXT TraceNext

INVARIANTS
  TypeOK
  EachRequestInOnePlace

PROPERTIES
  RefinesSafety

\* a trace ends; stopping there is not a deadlock
CHECK_DEADLOCK FALSE

POSTCONDITION TraceAccepted
