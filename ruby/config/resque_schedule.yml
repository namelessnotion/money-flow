# Recurring jobs for resque-scheduler (rake resque:scheduler). Loaded by
# lib/resque_boot.rb; spec/lib/resque_boot_spec.rb checks every class, queue
# and cron here resolves.

# Clears ACH deposits from the start of their third Federal Reserve business
# day after completion (Services::Ach::ClearingPolicy). Hourly rather than
# once a day: the sweep is idempotent, and a missed or failed run is picked up
# within the hour. Weekdays only — nothing becomes due on a weekend.
clear_ach_deposits:
  cron: "0 * * * 1-5 America/New_York"
  class: Jobs::ClearAchDeposits
  queue: ach
  description: Originate clearing Transactions for ACH deposits 3 business days after completion

# Hands every ready ACH entry to the provider: those whose real leg the read
# model has seen staged and that carry no provider reference yet
# (Services::Ach::SubmitDue). Since the async cutover this is the only thing
# that submits — Initiate accepts the Transaction and stops, because at that
# moment a withdrawal's funding leg has not run and there is nothing to be sure
# of (go/docs/adr/0006, ruby/docs/adr/0008).
#
# Every minute, which is cron's floor, and every day. This is the whole of the
# delay a customer sees between asking for a withdrawal and the entry reaching
# the provider, so it wants to be as short as the scheduler allows — unlike
# clearing, which waits on a calendar anyway. Weekends included: an entry
# should be queued for the next banking day, not sit out the weekend. It is
# idempotent, so a missed or failed run is picked up by the next.
submit_ach_entries:
  cron: "* * * * * America/New_York"
  class: Jobs::SubmitAchEntries
  queue: ach
  description: Submit ACH entries whose real leg is staged to the provider

# Pays every completed Repayment out to the holders of its Security, one
# Transaction per holder (ruby/docs/adr/0007). Every five minutes rather than
# hourly: unlike ACH clearing, nothing here waits on a calendar, so the only
# delay a holder sees is the sweep's own. Idempotent, so a missed or failed
# run is picked up by the next. Every day — a Borrower may repay on a weekend.
disburse_repayments:
  cron: "*/5 * * * * America/New_York"
  class: Jobs::DisburseRepayments
  queue: securities
  description: Originate Disbursement Transactions for each holder of every completed Repayment
