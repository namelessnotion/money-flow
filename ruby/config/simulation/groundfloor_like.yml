# A Groundfloor-like real estate lending market, for bin/simulate_lending.
#
# Calibrated from one investor's own platform exports (2,020 positions bought
# between 2018 and 2026, and ~25k account transactions from 2023-08 to
# 2025-12). This file holds aggregates only; the exports themselves are never
# committed. Loans there are LROs: one balloon repayment of principal plus
# simple interest at payoff, with no interim payments.
#
# Every distribution is a decile table: eleven values, p0, p10, … p100. A draw
# picks a uniform point and interpolates between the deciles either side.
# Amounts are in USD minor units (cents), matching the ledger.

# The real market's loans are ~$190k funded by thousands of ~$10 positions.
# A run with tens of Investors has to shrink the loans and grow the positions,
# or it would be thousands of Subscriptions per Security. Applied to every
# draw from the table named.
#
# Kept to ~20 Subscriptions per Security at the median: a Draw moves every
# Token in the escrow in one ledger batch, and at ~276 Tokens TigerBeetle
# refused it ("too much data was sent or requested in this batch"), halting
# the orchestrator. Widen these only once the Go side bounds a Transfer's legs.
scale:
  loan_amount: 0.01
  position: 10.0

loan_amount_minor_units: [3_103_000, 10_129_000, 12_766_000, 15_099_000, 16_916_900, 19_110_000,
                          20_991_000, 23_099_600, 25_429_000, 29_263_000, 100_000_000]

# Grade mix by count of positions, and each grade's rate deciles (p10 / p50 /
# p90 observed; p0 and p100 are the observed band's edges).
grades:
  A: { weight: 71,   annual_rate_bps: [550, 640, 650, 660, 680, 690, 750, 850, 950, 1050, 1100] }
  B: { weight: 482,  annual_rate_bps: [650, 830, 900, 950, 975, 1000, 1025, 1050, 1075, 1100, 1300] }
  C: { weight: 1124, annual_rate_bps: [850, 1000, 1025, 1050, 1075, 1100, 1125, 1150, 1175, 1200, 1400] }
  D: { weight: 308,  annual_rate_bps: [1000, 1100, 1150, 1200, 1225, 1250, 1300, 1325, 1350, 1400, 1600] }
  E: { weight: 35,   annual_rate_bps: [1250, 1350, 1400, 1425, 1450, 1500, 1500, 1525, 1550, 1550, 1650] }

# Term in months, by count of positions.
term_months: { 6: 164, 9: 99, 12: 753, 15: 812, 18: 14, 21: 176 }

# Payoff day relative to maturity. 56% paid early, 8% within a month, 36% late
# (extended). The observed tails reach -514 and +2,200 days; the table is
# trimmed at -365 and +540 so a run finishes, and a payoff is never earlier
# than `market.minimum_days_drawn` after the Draw.
payoff_offset_days: [-365, -259, -169, -108, -81, -40, 9, 83, 172, 363, 540]

# One Investor's total position in one Security. Auto-invest spreads money in
# small, even pieces: most positions are exactly $10.
position_minor_units: [100, 200, 300, 400, 700, 1_000, 1_000, 1_000, 1_000, 1_000, 10_000]

investor:
  # The first deposit, when the Investor joins.
  initial_deposit_minor_units: [50_000, 100_000, 150_000, 200_000, 250_000, 300_000,
                                400_000, 500_000, 750_000, 1_000_000, 2_000_000]
  # Occasional top-ups. The exports show 109 over ~28 months (0.13 a day) for
  # one account; each is a full ACH cycle here, so a run with tens of
  # Investors uses fewer, larger ones.
  top_up_probability_per_day: 0.03
  top_up_minor_units: [5_000, 8_000, 8_000, 8_000, 8_000, 8_000, 20_000, 40_000, 100_000, 200_000, 400_000]
  # Rare: 8 withdrawals in 2025, and small next to what stayed invested.
  # Takes a share of what is sitting idle and could leave (see Book).
  withdrawal_probability_per_day: 0.005
  withdrawal_share_percent: [5, 5, 10, 10, 15, 20, 20, 25, 30, 40, 50]

market:
  # New Securities offered per simulated day, on average (Poisson).
  offerings_per_day: 0.12
  # How many Investors auto-invest into an open offering on one day, at most.
  buyers_per_offering_per_day: 12
  # A payoff, however early the table says, comes at least this long after
  # the Draw.
  minimum_days_drawn: 30
