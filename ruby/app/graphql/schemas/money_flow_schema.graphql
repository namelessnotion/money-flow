  claimLegState: TransferState
  createdAt: ISO8601DateTime!
  currency: String!
  id: ID!
  investor: Entity

  """
  Projected state of the Transfer moving the Investor’s cleared cash into escrow. It waits for the claim leg.
  """
  moneyLegState: TransferState

  """
  Why it is in that state, when Go gave a reason.
  """
  reason: String

  """
  The Transaction’s projected state.
  """
  state: TransactionState
}

