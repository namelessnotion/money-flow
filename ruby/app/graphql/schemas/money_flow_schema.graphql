  The Investor holding it.
  """
  investor: Entity
  investorEntityId: ID!

  """
  What of it has not yet been repaid to them.
  """
  outstandingPrincipalMinorUnits: BigInt!

  """
  Everything they bought, across every Subscription.
  """
  principalMinorUnits: BigInt!
}

"""
Autogenerated return type of PurchaseSecurity.
"""
type PurchaseSecurityPayload {
  subscription: Subscription
}

type Query {
  """
  One ACH Transaction by id, or null when there is none.
  """
  achTransaction(id: ID!): AchTransaction

  """
  An entity's ACH Transactions, oldest first, paginated at 100 per page.
  """
  achTransactions(
    """
    Returns the elements in the list that come after the specified cursor.
    """
    after: String

    """
    Returns the elements in the list that come before the specified cursor.
    """
    before: String
    entityId: ID!

    """
    Returns the first _n_ elements from the list.
    """
    first: Int

    """
    Returns the last _n_ elements from the list.
    """
    last: Int
  ): AchTransactionConnection!

  """
  Onboarded entities, paginated at 100 per page.
  """
  entities(
    """
    Returns the elements in the list that come after the specified cursor.
    """
    after: String

    """
    Returns the elements in the list that come before the specified cursor.
    """
    before: String

    """
    Returns the first _n_ elements from the list.
    """
    first: Int

    """
    Returns the last _n_ elements from the list.
    """
    last: Int
  ): EntityConnection!

  """
  One entity by id, or null when there is none.
  """
  entity(id: ID!): Entity

  """
  Health check placeholder until real queries exist.
  """
  ok: Boolean!

  """
  A Security’s Repayments, oldest first, paginated at 100 per page.
  """
  repayments(
    """
    Returns the elements in the list that come after the specified cursor.
    """
    after: String

    """
    Returns the elements in the list that come before the specified cursor.
    """
    before: String

    """
    Returns the first _n_ elements from the list.
    """
    first: Int

    """
    Returns the last _n_ elements from the list.
    """
    last: Int
    securityId: ID!
  ): RepaymentConnection!

  """
  Securities, newest first, paginated at 100 per page.
  """
  securities(
    """
    Returns the elements in the list that come after the specified cursor.
    """
    after: String

    """
    Returns the elements in the list that come before the specified cursor.
    """
    before: String
    borrowerEntityId: ID

    """
    Returns the first _n_ elements from the list.
    """
    first: Int
    issuerEntityId: ID

    """
    Returns the last _n_ elements from the list.
    """
    last: Int
  ): SecurityConnection!

  """
  One Security by id, or null when there is none.
  """
  security(id: ID!): Security

  """
  A Security’s Subscriptions, oldest first, paginated at 100 per page.
  """
  subscriptions(
    """
    Returns the elements in the list that come after the specified cursor.
    """
    after: String

    """
    Returns the elements in the list that come before the specified cursor.
    """
    before: String

    """
    Returns the first _n_ elements from the list.
    """
    first: Int

    """
    Returns the last _n_ elements from the list.
    """
    last: Int
    securityId: ID!
  ): SubscriptionConnection!
}

