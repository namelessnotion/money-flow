  collectionLegState: TransferState
  createdAt: ISO8601DateTime!
  currency: String!

  """
  What each holder was paid of it. Empty until the sweep has originated them.
  """
  disbursements: [Disbursement!]!
  id: ID!
  interestMinorUnits: BigInt!
  principalMinorUnits: BigInt!
  reason: String
  state: TransactionState
}

