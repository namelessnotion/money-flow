type Account {
  """
  What the Account holds, one entry per currency; empty until the Account's first ledger activity has been consumed.
  """
  balances: [AccountBalance!]!
  createdAt: ISO8601DateTime!
  id: ID!
  name: String!
  type: String!
  updatedAt: ISO8601DateTime!
  walletUuid: ID!
}

"""
What an Account holds in one currency, summed over its Tokens from a read model that may lag the ledger.
"""
type AccountBalance {
  currency: String!

  """
  Reserved by staged Transfers to arrive in the Account, not yet posted or voided.
  """
  pendingIncomingMinorUnits: BigInt!

  """
  Reserved by staged Transfers to leave the Account, not yet posted or voided.
  """
  pendingOutgoingMinorUnits: BigInt!

  """
  Settled on the ledger. Negative when an Account that may overdraw has.
  """
  postedMinorUnits: BigInt!
}

"""
Which way an ACH Transaction moves money across the bank boundary.
"""
enum AchDirection {
  DEPOSIT
  WITHDRAWAL
}

"""
One step of an ACH Transaction’s lifecycle and where it stands, as the read model last saw it.
"""
type AchStep {
  name: AchStepName!
  status: AchStepStatus!
}

"""
A step in an ACH Transaction’s lifecycle, in the order it is reached.
"""
enum AchStepName {
  CLEARING
  COMPLETION
  FUNDING
  INITIATION
  ROLLBACK
  SETTLEMENT
  SUBMISSION
}

"""
Where an ACH lifecycle step stands. SKIPPED means an earlier step failed, so it will never run.
"""
enum AchStepStatus {
  DONE
  FAILED
  SKIPPED
  WAITING
}

"""
An ACH deposit or withdrawal. State fields come from a read model that may lag
the ledger; they are null until the first event for the Transaction has been consumed.
"""
type AchTransaction {
  amountMinorUnits: BigInt!

  """
  For a completed deposit, the Federal Reserve business day its clearing becomes due.
  """
  clearingDueOn: ISO8601Date

  """
  Projected state of the clearing Transaction that moves a settled deposit from
  uncleared to cleared cash. Null until one has been originated and projected.
  """
  clearingState: TransactionState
  createdAt: ISO8601DateTime!
  currency: String!
  direction: AchDirection!
  id: ID!
  providerReference: String

  """
  Projected state of the Transfer that crosses the bank boundary — pending while ACH settles.
  """
  realLegState: TransferState

  """
  Why the Transaction is in its state, when Go gave a reason.
  """
  reason: String

  """
  The Transaction's projected state.
  """
  state: TransactionState

  """
  The lifecycle steps — initiation, funding (a withdrawal), submission,
  settlement, completion, clearing (a deposit) and, while one is under way,
  rollback — and where each stands.
  """
  steps: [AchStep!]!
}

"""
The connection type for AchTransaction.
"""
type AchTransactionConnection {
  """
  A list of edges.
  """
  edges: [AchTransactionEdge]

  """
  A list of nodes.
  """
  nodes: [AchTransaction]

  """
  Information to aid in pagination.
  """
  pageInfo: PageInfo!
}

"""
An edge in a connection.
"""
type AchTransactionEdge {
  """
  A cursor for use in pagination.
  """
  cursor: String!

  """
  The item at the end of the edge.
  """
  node: AchTransaction
}

"""
Represents non-fractional signed whole numeric values. Since the value may
exceed the size of a 32-bit integer, it's encoded as a string.
"""
scalar BigInt

"""
Autogenerated return type of ClearAch.
"""
type ClearAchPayload {
  achTransaction: AchTransaction
}

type Entity {
  """
  Financial accounts held by this entity.
  """
  accounts: [Account!]!
  createdAt: ISO8601DateTime!
  holderUuid: ID!
  id: ID!
  name: String!

  """
  What part it plays in this market.
  """
  role: EntityRole!
  updatedAt: ISO8601DateTime!
}

"""
The connection type for Entity.
"""
type EntityConnection {
  """
  A list of edges.
  """
  edges: [EntityEdge]

  """
  A list of nodes.
  """
  nodes: [Entity]

  """
  Information to aid in pagination.
  """
  pageInfo: PageInfo!
}

"""
An edge in a connection.
"""
type EntityEdge {
  """
  A cursor for use in pagination.
  """
  cursor: String!

  """
  The item at the end of the edge.
  """
  node: Entity
}

"""
What part an entity plays in this market. It decides which accounts it holds.
"""
enum EntityRole {
  BORROWER
  INVESTOR
  ISSUER
}

"""
An ISO 8601-encoded date
"""
scalar ISO8601Date @specifiedBy(url: "https://tools.ietf.org/html/rfc3339")

"""
An ISO 8601-encoded datetime
"""
scalar ISO8601DateTime @specifiedBy(url: "https://tools.ietf.org/html/rfc3339")

"""
Autogenerated return type of InitiateAchDeposit.
"""
type InitiateAchDepositPayload {
  achTransaction: AchTransaction
}

"""
Autogenerated return type of InitiateAchWithdrawal.
"""
type InitiateAchWithdrawalPayload {
  achTransaction: AchTransaction
}

type Mutation {
  """
  Clear a completed deposit now, without waiting for its return window (for demonstrations).
  """
  clearAch(achTransactionId: ID!): ClearAchPayload

  """
  Originate an ACH debit of the entity’s bank account into its cash account.
  """
  initiateAchDeposit(
    """
    Amount in US cents.
    """
    amountMinorUnits: BigInt!
    entityId: ID!
  ): InitiateAchDepositPayload

  """
  Originate an ACH credit from the entity’s cash account out to its bank account.
  """
  initiateAchWithdrawal(
    """
    Amount in US cents.
    """
    amountMinorUnits: BigInt!
    entityId: ID!
  ): InitiateAchWithdrawalPayload
  onboardEntity(
    name: String!

    """
    Which accounts to open for it.
    """
    role: EntityRole!
  ): OnboardEntityPayload

  """
  Record that the ACH network returned the entry; the Transaction is rolled back.
  """
  returnAch(
    achTransactionId: ID!

    """
    The return reason, e.g. "R01 insufficient funds".
    """
    reason: String!
  ): ReturnAchPayload

  """
  Record that the ACH network posted the entry.
  """
  settleAch(achTransactionId: ID!): SettleAchPayload
}

"""
Autogenerated return type of OnboardEntity.
"""
type OnboardEntityPayload {
  entity: Entity
}

"""
Information about pagination in a connection.
"""
type PageInfo {
  """
  When paginating forwards, the cursor to continue.
  """
  endCursor: String

  """
  When paginating forwards, are there more items?
  """
  hasNextPage: Boolean!

  """
  When paginating backwards, are there more items?
  """
  hasPreviousPage: Boolean!

  """
  When paginating backwards, the cursor to continue.
  """
  startCursor: String
}

type Query {
  """
  One ACH Transaction by id, or null when there is none.
  """
  achTransaction(id: ID!): AchTransaction

  """
  An entity's ACH Transactions, oldest first, paginated at 100 per page.
  """
  achTransactions(
    """
    Returns the elements in the list that come after the specified cursor.
    """
    after: String

    """
    Returns the elements in the list that come before the specified cursor.
    """
    before: String
    entityId: ID!

    """
    Returns the first _n_ elements from the list.
    """
    first: Int

    """
    Returns the last _n_ elements from the list.
    """
    last: Int
  ): AchTransactionConnection!

  """
  Onboarded entities, paginated at 100 per page.
  """
  entities(
    """
    Returns the elements in the list that come after the specified cursor.
    """
    after: String

    """
    Returns the elements in the list that come before the specified cursor.
    """
    before: String

    """
    Returns the first _n_ elements from the list.
    """
    first: Int

    """
    Returns the last _n_ elements from the list.
    """
    last: Int
  ): EntityConnection!

  """
  One entity by id, or null when there is none.
  """
  entity(id: ID!): Entity

  """
  Health check placeholder until real queries exist.
  """
  ok: Boolean!
}

"""
Autogenerated return type of ReturnAch.
"""
type ReturnAchPayload {
  achTransaction: AchTransaction
}

"""
Autogenerated return type of SettleAch.
"""
type SettleAchPayload {
  achTransaction: AchTransaction
}

"""
A Transaction's state as Ruby's read model last saw it. It may lag the ledger.
"""
enum TransactionState {
  COMPLETED
  INITIALIZED
  REJECTED
  ROLLBACK_FAILED
  ROLLBACK_STARTED
  ROLLED_BACK
  STARTED
}

"""
A Transfer's state as Ruby's read model last saw it. It may lag the ledger.
"""
enum TransferState {
  ACCEPTED
  CANCELLED
  COMMITTED
  FAILED
  PENDING
  PREPARED
  REJECTED
  STAGED
}
