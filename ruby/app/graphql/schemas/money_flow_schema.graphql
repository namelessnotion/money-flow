type IssueSecurityPayload {
  security: Security
}

type Mutation {
  """
  Clear a completed deposit now, without waiting for its return window (for demonstrations).
  """
  clearAch(achTransactionId: ID!): ClearAchPayload

  """
  Disburse a completed Repayment to its holders now, without waiting for the sweep (for demonstrations).
  """
  disburseRepaymentNow(repaymentId: ID!): DisburseRepaymentNowPayload

  """
  Move a fully subscribed Security’s escrowed money to its Borrower’s cleared cash.
  """
  drawSecurity(securityId: ID!): DrawSecurityPayload

  """
  Originate an ACH debit of the entity’s bank account into its cash account.
  """
  initiateAchDeposit(
    """
    Amount in US cents.
    """
    amountMinorUnits: BigInt!
    entityId: ID!
  ): InitiateAchDepositPayload

  """
  Originate an ACH credit from the entity’s cash account out to its bank account.
  """
  initiateAchWithdrawal(
    """
    Amount in US cents.
    """
    amountMinorUnits: BigInt!
    entityId: ID!
  ): InitiateAchWithdrawalPayload

  """
  Offer a Security in a Borrower’s debt obligation, minting its Supply.
  """
  issueSecurity(terms: SecurityTermsInput!): IssueSecurityPayload
  onboardEntity(
    name: String!

    """
    Which accounts to open for it.
    """
    role: EntityRole!
  ): OnboardEntityPayload

  """
  Buy a fraction of a Security. Refused if the Supply is short, or if the
  Investor’s cleared cash is — the latter only once Go has run and rolled the
  Transaction back.
  """
  purchaseSecurity(amountMinorUnits: BigInt!, investorEntityId: ID!, securityId: ID!): PurchaseSecurityPayload

  """
  Record a Borrower’s payment of principal and interest into a Security.
  """
  recordSecurityRepayment(interestMinorUnits: BigInt!, principalMinorUnits: BigInt!, securityId: ID!): RecordSecurityRepaymentPayload

  """
  Record that the ACH network returned the entry; the Transaction is rolled back.
  """
  returnAch(
    achTransactionId: ID!

    """
    The return reason, e.g. "R01 insufficient funds".
    """
    reason: String!
  ): ReturnAchPayload

  """
  Record that the ACH network posted the entry.
  """
  settleAch(achTransactionId: ID!): SettleAchPayload
}

