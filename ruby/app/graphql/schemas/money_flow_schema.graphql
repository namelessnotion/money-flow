"""
A claim on one Borrower’s debt obligation, offered by an Issuer and bought in
fractions. State fields come from a read model that may lag the ledger; they are
null until the first event for the Transaction has been consumed.
"""
type Security {
  """
  Simple interest rate, in basis points.
  """
  annualRateBps: Int!
  borrower: Entity
  createdAt: ISO8601DateTime!
  currency: String!

  """
  Projected state of the Transaction that moved the escrow to the Borrower. Null until one is originated.
  """
  drawState: TransactionState

  """
  The day the money reached the Borrower, by Go’s clock. Interest accrues from it.
  """
  drawnOn: ISO8601Date
  id: ID!
  issuer: Entity
  name: String!

  """
  Projected state of the Transaction that minted the Supply.
  """
  offeringState: TransactionState

  """
  What holders are still owed.
  """
  outstandingPrincipalMinorUnits: BigInt!

  """
  What each Investor holds in it.
  """
  positions: [Position!]!

  """
  The offering size.
  """
  principalMinorUnits: BigInt!

  """
  What is left to sell, as the read model last saw it. Advisory: the Supply
  wallet is what actually refuses an oversubscription, and it may refuse one
  this did not foresee.
  """
  remainingMinorUnits: BigInt!

  """
  The furthest phase it has reached.
  """
  stage: SecurityStageName!

  """
  Every phase — offering, funded, drawn, repaying, repaid — and where each
  stands. Clients render this rather than re-deriving it from raw states.
  """
  stages: [SecurityStage!]!

  """
  What has been sold, as the read model last saw it.
  """
  subscribedMinorUnits: BigInt!
  termDays: Int!
}

