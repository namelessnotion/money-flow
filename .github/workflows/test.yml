name: Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  go:
    name: Go tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: money_flow
          POSTGRES_PASSWORD: money_flow
          POSTGRES_DB: money_flow_test
        options: >-
          --health-cmd "pg_isready -U money_flow -d money_flow_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      # The Go tests append to the real event log, and the events table's
      # append-only triggers make anything written there permanent — so they
      # read TEST_DATABASE_URL and refuse outright to run against a database
      # whose name doesn't end in _test. DATABASE_URL is what cmd/migrate
      # reads; in CI the service database is created fresh per job, so both
      # point at the same throwaway database.
      DATABASE_URL: postgres://money_flow:money_flow@localhost:5432/money_flow_test?sslmode=disable
      TEST_DATABASE_URL: postgres://money_flow:money_flow@localhost:5432/money_flow_test?sslmode=disable

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Apply event-store migrations
        working-directory: go
        run: go run ./cmd/migrate up

      - name: Run Go tests
        working-directory: go
        run: go test ./...

  ruby:
    name: Ruby specs
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: money_flow
          POSTGRES_PASSWORD: money_flow
          POSTGRES_DB: money_flow_dev
        options: >-
          --health-cmd "pg_isready -U money_flow -d money_flow_dev"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      # DATABASE_URL is deliberately absent: spec_helper sets APP_ENV=test,
      # which makes lib/boot connect to TEST_DATABASE_URL instead, and then
      # refuses to run at all against a database whose name doesn't end in
      # _test. The specs assert on whole-table queries, so sharing a database
      # with anything else makes them fail on rows they didn't create.
      TEST_DATABASE_URL: postgres://money_flow:money_flow@localhost:5432/money_flow_test?sslmode=disable

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.4.10
          bundler-cache: true
          working-directory: ruby

      # The service above only creates money_flow_dev, so this exercises the
      # same create-then-migrate path a fresh developer machine takes rather
      # than a CI-only shortcut.
      - name: Create and migrate the test database
        working-directory: ruby
        run: bundle exec bin/setup_test_db

      - name: Run Ruby specs
        working-directory: ruby
        run: bundle exec rspec
