syntax = "proto3";
package transaction.v1;

import "shared/v1/money.proto";

option go_package = "github.com/namelessnotion/money_flow/go/gen/proto/transaction/v1";

// ***********
// ** Types **
// ***********

/* Transaction representation of a Transfer prior to it being requested. We can not use
   messages defined in the Root Aggregate Transfer proto as that is a seperate Root Aggregate and we
   can't cross that boundary. Transfer does expose the interface for requesting a Transfer and we can
   use that knowledge to know what information needs to be placed here. Additional information can be
   added here that only applies to Transaction Root Aggregate as well. */

// NOTE: When we say Transfer inside of Transaction we are referring to this message,
// which eventual can be used to effectively map to the Root Aggregate Transfer.
message Transfer {
  string id = 1;
  shared.v1.Money amount = 2;
  string from_wallet_id = 3;
  string to_wallet_id = 4;
  bool auto_process = 5; // automatically process or wait for external StartProcessing
  // auto_process does not go in the transfer.proto because auto processing only makes
  // sense in the context of a Transaction and only a Transaction can determine if all
  // deps are met for a Transfer to start processing

  // Echoes RequestTransferRequest.stage for this child — Transaction has no
  // opinion of its own on staging, it just passes the caller's choice through.
  bool stage = 6;
  // Echoes RequestTransferRequest.mint_source (see transfer.proto) — set true
  // for a child whose from_wallet_id is a funding/control wallet with no
  // persistent selectable balance (e.g. Bank Account, Bank Control), so
  // prepare() mints a fresh source Token for this leg instead of FIFO-selecting.
  bool mint_source = 7;
}

message TransferIdList {
  repeated string transfer_id = 1;
}

// ********************************
// ** Domain Commands and Events **
// ********************************

/* Command to build out a Financial Transaction */
message StartInitializingTransactionRequest {
  string id = 1;

  // Opaque to go/ — Ruby's own metadata identifying which business-process
  // template built this DAG (e.g. "ach_deposit", "v2"). go/ records both
  // verbatim on TransactionInitialized and never interprets or validates
  // them; go/ has no factory registry of its own in v1, and this plan does
  // not add one. The external_guid field an earlier draft of this scaffold
  // also carried is dropped entirely: id (a caller-supplied UUID) is already
  // this aggregate's one identity/idempotency key, the same as every other
  // aggregate in this codebase — a second identifier would need its own
  // conflict rule (same external_guid, different id?) that nothing requires.
  string factory_name = 2;
  string factory_version = 3;

  // keyed by the Transfer's own id, so we can do dependency mapping based on id
  map<string, Transfer> transfers = 4;

  // child_id -> every parent id that must complete before the child becomes
  // ready (an AND-join). Natively expresses one-to-one, many-to-one,
  // one-to-many, and many-to-many, with no synthetic chain nodes.
  map<string, TransferIdList> transfer_dependency = 5;

  /***
     Rules:
      - A Transfer can not be directly or indirectly depedent on it self

      - one to one

      B depends on A
      { B => [A] }

     - many to one

     The order in which A, B and C are processed doesn't matter
     { D => [A, B, C] }   =>  D is dep on A, B and C

     - one to many

     A gets processed first
     { B => [A],
       C => [A],
       D => [A] }

     - many to many(ish)

     A, B, C, D, W, X, Y, X, N
     N is dependent on A, B, C, D
     W, X, Y, Z are dependent on N

     dep mapping:
     { N => [A, B, C, D],
       W => [N],
       X => [N],
       Y => [N],
       Z => [N] }

     A child with no entry (or an empty list) is a DAG root, ready immediately
     when the Transaction starts executing.

     There is an upper bound on how many transfers one Transaction may hold,
     and it is generous — a shape anywhere near it is a caller that has lost
     track of what it is building. It exists because a Transaction is the unit
     of rollback: an N-child Transaction failing is N reversals needing an
     operator's attention, so N has to stay comprehensible. Exceeding it is a
     TransactionRejected, before anything is written. See
     go/internal/transaction's maxTransfersPerTransaction for the number and the
     full reasoning; a wide-but-legal DAG is also dispatched in slices rather
     than all at once, so no single step of the saga is unbounded either.
  */
}

message TransactionInitialized {
  string id = 1;
  string factory_name = 2;
  string factory_version = 3;
  map<string, Transfer> transfers = 4;
  map<string, TransferIdList> transfer_dependency = 5;
}

message TransactionRejected {
  string id = 1;
  // cyclic/self dependency, dangling parent reference, empty transfers map,
  // more transfers than one Transaction may hold, a leg whose amount no
  // Transfer would accept (zero, no currency, or absent), an immediately
  // dispatchable child that could not be funded, ...
  string reason = 2;
}

message StartInitializingTransactionResponse {
  string id = 1;
  oneof result {
    TransactionInitialized transaction_initialized = 2;
    TransactionRejected transaction_rejected = 3;
  }
}

message TransactionStarted {
  string id = 1;
}

// --- Per-child bookkeeping Transaction records on its OWN stream as it
// drives each child Transfer forward or back. Not exposed via any RPC —
// saga-internal, produced only by transaction/saga.go, the same relationship
// operation.Staged/Performed has to transfer/saga.go.

message TransferRequestedWithinTransaction {
  string id = 1;
  string transfer_id = 2;
}

// auto_process=false, awaiting StartProcessingTransfer.
message TransferGatedWithinTransaction {
  string id = 1;
  string transfer_id = 2;
}

message TransferCompletedWithinTransaction {
  string id = 1;
  string transfer_id = 2;
}

message TransferFailedWithinTransaction {
  string id = 1;
  string transfer_id = 2;
  string reason = 3;
}

message TransactionCompleted {
  string id = 1;
}

message StartTransactionRollbackRequest {
  string id = 1;
  string reason = 2;
}

message TransactionRollbackStarted {
  string id = 1;
  string reason = 2;
}

enum RollbackMethod {
  ROLLBACK_METHOD_UNSPECIFIED = 0;
  ROLLBACK_METHOD_REVERSED = 1;   // child was Committed -> RequestReversal
  ROLLBACK_METHOD_CANCELLED = 2;  // child was Accepted/Prepared/Staged/Pending -> Cancel*Transfer
  ROLLBACK_METHOD_ABANDONED = 3;  // child was only Gated, never requested -> nothing to call
}

// A committed child is undone by RequestReversal, and a Reversal is itself a
// Transfer running its own saga — so "reversal requested" and "child rolled
// back" are two distinct facts that can be separated in time. This records the
// first of them, naming the Reversal the Transaction is now waiting on, so the
// child's rollback can be resolved later from that Reversal's own outcome
// rather than from an inline read that only holds while the saga is
// synchronous. reversal_id is derived deterministically, so a repeated sweep
// re-requests the same Reversal rather than starting a second one.
message TransferReversalRequestedWithinTransaction {
  string id = 1;
  string transfer_id = 2;
  string reversal_id = 3;
}

message TransferRolledBackWithinTransaction {
  string id = 1;
  string transfer_id = 2;
  RollbackMethod method = 3;
  string detail_id = 4; // the reversal Transfer's own id, when method == REVERSED
}

message TransferRollbackFailedWithinTransaction {
  string id = 1;
  string transfer_id = 2;
  string reason = 3;
}

message TransactionRolledBack {
  string id = 1;
  string reason = 2;
}

// A reversal is itself a Transfer that can independently fail. When the
// rollback sweep stalls with at least one child that could not be rolled
// back, the Transaction cannot honestly claim TransactionRolledBack — this
// is that distinct, operator-attention-required terminal instead, matching
// how TransferFailed is a true terminal for Transfer rather than something
// the saga walks back out of.
message TransactionRollbackFailed {
  string id = 1;
  string reason = 2;
}

message StartProcessingTransferRequest {
  string id = 1;
  string transfer_id = 2;
}

message StartProcessingTransferRejected {
  string id = 1;
  string transfer_id = 2;
  string reason = 3;
}

message StartProcessingTransferResponse {
  string id = 1;
  oneof result {
    TransferRequestedWithinTransaction transfer_requested_within_transaction = 2;
    TransferFailedWithinTransaction transfer_failed_within_transaction = 3;
    StartProcessingTransferRejected start_processing_transfer_rejected = 4;
  }
}

enum TransactionState {
  TRANSACTION_STATE_UNSPECIFIED = 0;
  TRANSACTION_STATE_INITIALIZED = 1;
  TRANSACTION_STATE_STARTED = 2;
  TRANSACTION_STATE_ROLLBACK_STARTED = 3;
  TRANSACTION_STATE_COMPLETED = 4;
  TRANSACTION_STATE_ROLLED_BACK = 5;
  TRANSACTION_STATE_ROLLBACK_FAILED = 6;
  TRANSACTION_STATE_REJECTED = 7;
}

// Reads where a Transaction stands. It advances nothing.
//
// It was called ResumeTransaction, and it did resume: a staged child settles
// through calls made on ITS OWN id (ConfirmStagedTransfer/PostPendingTransfer),
// and this was the only way the owning Transaction could be told to go and
// look. Since the async cutover it is not needed for that — those settlement
// calls write events of their own, and go/cmd/orchestrator follows them back to
// the owning Transaction — and the name would have been a lie, next to a
// transaction.Server.Resume that really does drive.
//
// What it is for now is authority. ruby's view of a Transaction is a lagging
// projection and is never the truth, so anything that must know where one
// actually stands before acting on it — an ACH entry about to be handed to a
// provider, above all — asks here rather than reading its own tables.
message GetTransactionStateRequest {
  string id = 1;
}

message GetTransactionStateResponse {
  string id = 1;
  TransactionState state = 2;
  string reason = 3;
}

message StartTransactionRollbackResponse {
  string id = 1;
  TransactionState state = 2;
}

service TransactionService {
  rpc StartInitializingTransaction(StartInitializingTransactionRequest) returns (StartInitializingTransactionResponse) {}
  rpc StartProcessingTransfer(StartProcessingTransferRequest) returns (StartProcessingTransferResponse) {}
  rpc GetTransactionState(GetTransactionStateRequest) returns (GetTransactionStateResponse) {}
  rpc StartTransactionRollback(StartTransactionRollbackRequest) returns (StartTransactionRollbackResponse) {}
}
