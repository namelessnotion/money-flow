syntax = "proto3";

option go_package = "github.com/namelessnotion/money_flow/go/gen/proto/transfer/v1";
package transfer.v1;

import "shared/v1/money.proto";

// A Transfer moves an amount from a Source Wallet to a Destination Wallet.
// It never moves money directly between existing Tokens: one or more new
// Tokens are minted in the destination Wallet for the transferred amount
// (v1 always mints exactly one), and the Transfer's legs (TransferLeg) then
// move capacity out of the source Wallet's existing Token(s) into those new
// Token(s)' TigerBeetle accounts — this is what keeps money's provenance
// traceable instead of commingled within a Wallet.
//
// A leg is an entity inside the Transfer, not an aggregate of its own: every
// leg is recorded on TransferPrepared and reaches the Transfer's own outcome
// (Staged, Committed, Cancelled, Failed) together with every other leg, so
// the Transfer's stream is the whole record of what its legs did
// (go/docs/adr/0009).
message RequestTransferRequest {
  string id = 1;
  string from_wallet_id = 2;
  string to_wallet_id = 3;
  shared.v1.Money amount = 4;
  // true: reserve via TigerBeetle pending transfers and walk
  // staged -> pending -> posted via Confirm/Cancel/PostPendingTransfer.
  // false (default): commit immediately.
  bool stage = 5;
  // The Transaction that requested this Transfer, if any; empty for a
  // standalone Transfer. Tags any Token minted for this Transfer (source or
  // destination) with this id, so wallet.TokensOfVisibleTo can hide it from
  // every other Transaction's FIFO source selection until this Transaction
  // closes — the mechanism that keeps a Transaction's compensation from
  // racing a later, unrelated caller that spends the same Token down first.
  string transaction_id = 6;
  // true: from_wallet_id has no persistent, FIFO-selectable balance of its
  // own — this is a funding/control wallet (e.g. Bank Account, Bank Control)
  // recognizing a fresh inflow right now. prepare() mints a brand-new source
  // Token for exactly `amount` and uses it as the sole DEBIT leg, skipping
  // selectSourceTokens's existing-balance FIFO/sufficiency check entirely.
  // false (default, existing behavior unchanged): FIFO-select from
  // from_wallet_id's existing Tokens as today. A per-request flag, not
  // inferred from the Wallet's Allows policy — the same reasoning as
  // `stage`: the caller (ruby, or Transaction) is the one who knows whether
  // this specific request represents a genuinely new inflow.
  //
  // GUARANTEED, not just conventional: true is only legal when
  // transaction_id is also set, and only when from_wallet_id both exists
  // and has an Allows policy including ONRAMP — RequestTransfer enforces
  // both, not just Transaction's own callers.
  bool mint_source = 7;
}

// One destination Token funded by a Transfer (or Reversal). v1 forward
// Transfers always populate exactly one of these; a Reversal may populate
// several, mirroring the many-to-one shape of the Transfer it reverses.
message TransferDestination {
  // 3 was credit_operation_id, the bookkeeping-only CREDIT Operation folded
  // into the Transfer by go/docs/adr/0009.
  reserved 3;
  reserved "credit_operation_id";

  string to_token_id = 1;
  shared.v1.Money amount = 2;
}

message TransferRequestAccepted {
  // 6 was debit_operation_ids, never populated: a Transfer's legs are
  // decided at prepare, and recorded on TransferPrepared (go/docs/adr/0009).
  reserved 6;
  reserved "debit_operation_ids";

  string id = 1;
  string from_wallet_id = 2;
  string to_wallet_id = 3;
  shared.v1.Money amount = 4;
  // Token(s) newly minted in the destination Wallet to receive the amount.
  repeated TransferDestination destinations = 5;
  // Echoes the request's stage flag — the saga has to know, on every resume
  // from the event log, whether this Transfer takes the staging branch,
  // and nothing else records that fact once accepted.
  bool stage = 7;
  string transaction_id = 8; // echoes the request, so prepare() can read it back on resume
  bool mint_source = 9;      // echoes the request, for the same resume reason
}

message TransferRequestRejected {
  string id = 1;
  string reason = 2;
}

message RequestTransferResponse {
  string id = 1;
  oneof result {
    TransferRequestAccepted transfer_request_accepted = 2;
    TransferRequestRejected transfer_request_rejected = 3;
  }
}

message CancelAcceptedTransferRequest {
  string id = 1;
  string reason = 2;
}

message AcceptedTransferCancelled {
  string id = 1;
  string reason = 2;
}

message CancelAcceptedTransferResponse {
  string id = 1;
  oneof result {
    AcceptedTransferCancelled accepted_transfer_cancelled = 2;
  }
}

// The remaining commands/events step the Transfer saga through preparing,
// staging, committing, cancelling and compensating its legs. These are
// driven internally by the Transfer process manager, not called directly
// over RPC (except the staged-settlement RPCs below, which resume the saga
// from outside).

message StartPreparingTransfer {
  string id = 1;
}

message PreparingTransferStarted {
  string id = 1;
}

message CompletePreparingTransfer {
  string id = 1;
}

// One leg of a Transfer: an amount moving from source_token_id to
// dest_token_id, as exactly one TigerBeetle transfer debiting the source
// Token's account and crediting the destination's. A Transfer's legs are
// submitted to TigerBeetle together as linked chains, so they commit or fail
// together (go/docs/adr/0008 for a Transfer wider than one chain).
//
// Recorded on TransferPrepared, before anything is submitted, so a crash
// recovers the same legs and a reversal can later reconstruct the manifest
// (swap source and dest per leg) without re-deriving Token selection, which
// could legitimately answer differently by the time a reversal is requested.
message TransferLeg {
  // 5 was credit_operation_id, the bookkeeping-only CREDIT Operation folded
  // into the Transfer by go/docs/adr/0009.
  reserved 5;
  reserved "credit_operation_id";

  string source_token_id = 1;
  string dest_token_id = 2;
  shared.v1.Money amount = 3;
  // The leg's TigerBeetle transfer id, recorded here so every retry of
  // stage()/commit() submits the same id and TigerBeetle answers Exists.
  // A staged leg's post and void are derived from it. Formerly named
  // debit_operation_id; the field number is unchanged, so older
  // TransferPrepared events still decode.
  string ledger_transfer_id = 4;
}

message TransferPrepared {
  string id = 1;
  repeated TransferLeg legs = 2;
}

message StartCancellingPreparedTransfer {
  string id = 1;
  string reason = 2;
}

message CancellingPreparedTransferStarted {
  string id = 1;
  string reason = 2;
}

message CompleteCancellingPreparedTransfer {
  string id = 1;
}

message PreparedTransferCancelled {
  string id = 1;
  string reason = 2;
}

// StartCompensatingFailedTransfer/TransferFailed are reached only when
// TigerBeetle itself rejects a batch WE submitted (at stage() or at
// commit()/post time) — an invariant our own ledger couldn't satisfy. This
// is distinct from TransferCancelled below, which is reached when an
// EXTERNAL factor (ruby reporting failed provisioning, or the provider
// stopping an in-flight transfer) stops the Transfer instead.
message StartCompensatingFailedTransfer {
  string id = 1;
  string reason = 2;
}

message FailedTransferCompensationStarted {
  string id = 1;
  string reason = 2;
}

message CompleteCompensatingFailedTransfer {
  string id = 1;
}

message TransferFailed {
  string id = 1;
  string reason = 2; // what TigerBeetle refused, e.g. "tigerbeetle rejected commit leg 0: ..."
}

message StartCommittingTransfer {
  string id = 1;
}

message TransferCommittingStarted {
  string id = 1;
}

// This is where every leg is submitted to TigerBeetle together as
// one linked transfer chain — atomic commit or atomic rejection, so there's
// no partially-applied state to compensate for here. For an immediate
// (non-staged) Transfer this is a fresh linked chain of ordinary transfers;
// for a staged Transfer reaching this point via PostPendingTransfer, it is
// instead a linked chain of post_pending_transfer entries referencing each
// leg's already-staged TigerBeetle transfer id. Either way, once
// TigerBeetle confirms, TransferCommitted fires — "posted" (the staged
// flow's vocabulary) and "committed" are the same terminal state reached by
// two different routes.
message CommitTransfer {
  string id = 1;
}

message TransferCommitted {
  string id = 1;
  repeated TransferDestination destinations = 2;
}

// --- Staging (new) — the saga steps between TransferPrepared and the
// StartCommittingTransfer/TransferCommitted pair above, taken only when the
// accepted request had stage = true. Four states from here: Staged,
// Pending, Cancelled, and (shared with the immediate path) Committed/
// "posted". TransferStaged and TransferPending are each "terminal for now":
// runSaga stops at either and waits for the next RPC below, which may
// arrive seconds or days later.

message StartStagingTransfer {
  string id = 1;
}

message StagingTransferStarted {
  string id = 1;
}

message CompleteStagingTransfer {
  string id = 1;
}

message TransferStaged {
  string id = 1;
}

// Called by ruby once its own provisioning call to the provider succeeds.
// Pure event-log write — the TigerBeetle reservation already exists from
// staging, nothing more to reserve. Idempotent: calling it again once
// already Pending (or later) converges on the existing result.
message ConfirmStagedTransferRequest {
  string id = 1;
}

message TransferPending {
  string id = 1;
}

message ConfirmStagedTransferRejected {
  string id = 1;
  string reason = 2; // e.g. not found, not in Staged state
}

message ConfirmStagedTransferResponse {
  string id = 1;
  oneof result {
    TransferPending transfer_pending = 2;
    ConfirmStagedTransferRejected confirm_staged_transfer_rejected = 3;
  }
}

// Called by ruby when an EXTERNAL factor stops the Transfer: provisioning
// with the provider failed (from Staged), or the provider later reports the
// in-flight transfer didn't go through (from Pending) — legal from either
// state, since the underlying mechanics are identical either way. Voids the
// TigerBeetle reservation via void_pending_transfer, then records
// TransferCancelled (not TransferFailed — this is an external-factor stop,
// not an invariant violation).
message CancelStagedTransferRequest {
  string id = 1;
  string reason = 2;
}

message StartCancellingStagedTransfer {
  string id = 1;
  string reason = 2;
}

message CancellingStagedTransferStarted {
  string id = 1;
  string reason = 2;
}

message CompleteCancellingStagedTransfer {
  string id = 1;
}

message TransferCancelled {
  string id = 1;
  string reason = 2;
}

message CancelStagedTransferRejected {
  string id = 1;
  string reason = 2;
}

message CancelStagedTransferResponse {
  string id = 1;
  oneof result {
    TransferCancelled transfer_cancelled = 2;
    CancelStagedTransferRejected cancel_staged_transfer_rejected = 3;
  }
}

// Called by ruby once the provider confirms the funds posted (from
// Pending). Drives CommitTransfer's posting variant via
// post_pending_transfer instead of a fresh TigerBeetle transfer, then
// reuses the existing StartCommittingTransfer/TransferCommittingStarted/
// TransferCommitted events unchanged. A TigerBeetle-level rejection of the
// post itself is an invariant violation, not an external factor, so it
// routes through the compensate path to TransferFailed like any other
// commit-time rejection, never TransferCancelled.
message PostPendingTransferRequest {
  string id = 1;
}

message PostPendingTransferRejected {
  string id = 1;
  string reason = 2; // e.g. not found, not in Pending state
}

message PostPendingTransferResponse {
  string id = 1;
  oneof result {
    TransferCommitted transfer_committed = 2;
    PostPendingTransferRejected post_pending_transfer_rejected = 3;
  }
}

// --- Reversal — a Transfer that pulls money back out of a previously
// committed Transfer's destination Token(s), into the original source
// Token(s) it came from. Modeled as a brand new Transfer instance (its own
// id, own stream), not a rewind of the original: an event stream reaching
// TransferCommitted stays a linear terminal history, "undo" is a new fact.
// Downstream of accept, a Reversal is structurally identical to a forward
// Transfer (N legs -> linked TigerBeetle batch -> M destination Tokens) —
// it drives through the exact same saga states above, including staging.
// The only difference is how the legs get computed: derived from the
// original Transfer's own recorded legs rather than selected fresh
// (see reversalManifest in the implementation), so no new Token is ever
// minted for a Reversal.
message RequestReversalRequest {
  string id = 1;
  string transfer_id = 2; // the original, committed Transfer being reversed
  string reason = 3;
  bool stage = 4; // same semantics as RequestTransferRequest.stage
  // Audit-only: a reversal never mints a Token, so nothing new to tag, but
  // recording which Transaction drove it is worth having for symmetry with
  // RequestTransferRequest.transaction_id.
  string transaction_id = 5;
}

message ReversalRequestAccepted {
  // 5 was debit_operation_ids, never populated (see TransferRequestAccepted).
  reserved 5;
  reserved "debit_operation_ids";

  string id = 1;
  string transfer_id = 2;
  shared.v1.Money amount = 3;
  repeated TransferDestination destinations = 4; // == original transfer's source Token(s)
  bool stage = 6; // echoes the request's stage flag, same reason as TransferRequestAccepted.stage
  string transaction_id = 7;
}

message ReversalRequestRejected {
  string id = 1;
  string transfer_id = 2;
  string reason = 3;
}

message RequestReversalResponse {
  string id = 1;
  oneof result {
    ReversalRequestAccepted reversal_request_accepted = 2;
    ReversalRequestRejected reversal_request_rejected = 3;
  }
}

service TransferService {
  rpc RequestTransfer(RequestTransferRequest) returns (RequestTransferResponse) {}
  rpc CancelAcceptedTransfer(CancelAcceptedTransferRequest) returns (CancelAcceptedTransferResponse) {}
  rpc RequestReversal(RequestReversalRequest) returns (RequestReversalResponse) {}
  rpc ConfirmStagedTransfer(ConfirmStagedTransferRequest) returns (ConfirmStagedTransferResponse) {}
  rpc CancelStagedTransfer(CancelStagedTransferRequest) returns (CancelStagedTransferResponse) {}
  rpc PostPendingTransfer(PostPendingTransferRequest) returns (PostPendingTransferResponse) {}
}
